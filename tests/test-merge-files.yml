name: Test merge-files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Go project
        run: |
          mkdir -p /tmp/go-project
          cat > /tmp/go-project/go.mod << 'EOF'
          module example.com/hello

          go 1.21
          EOF
          cat > /tmp/go-project/main.go << 'EOF'
          package main

          func main() {}
          EOF
      - name: Run staticcheck in binary mode to produce a merge input file
        id: binary-run
        uses: .
        with:
          version: "latest"
          install-go: true
          working-directory: /tmp/go-project
          output-format: "binary"
          output-file: "/tmp/staticcheck-result.bin"
          use-cache: false
      - name: Verify binary output file was created
        run: |
          if [ ! -f /tmp/staticcheck-result.bin ]; then
            echo "FAIL: binary output file was not created"
            exit 1
          fi
          echo "PASS: binary output file exists"
      - id: merge-action
        uses: .
        with:
          version: "latest"
          install-go: false
          merge-files: "/tmp/staticcheck-result.bin"
          use-cache: false
      - name: Assert merge ran successfully
        run: |
          echo "PASS: staticcheck ran with merge-files input"
