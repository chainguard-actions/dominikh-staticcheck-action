name: Test staticcheck with merge-files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy Go fixture into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/go-basic" "$GITHUB_WORKSPACE/go-basic"

      - name: Run staticcheck to produce binary output file
        id: produce_binary
        uses: .
        with:
          version: "latest"
          install-go: "true"
          use-cache: "false"
          working-directory: "go-basic"
          output-format: "binary"
          output-file: "/tmp/staticcheck-binary.bin"

      - name: Assert binary output file was created
        run: |
          if [ ! -f "/tmp/staticcheck-binary.bin" ]; then
            echo "FAIL: binary output file was not created"
            exit 1
          fi
          echo "Binary output file created successfully"

      - id: action
        uses: .
        with:
          version: "latest"
          install-go: "false"
          use-cache: "false"
          merge-files: "/tmp/staticcheck-binary.bin"

      - name: Assert merge ran successfully
        run: |
          echo "Staticcheck merge completed successfully"
          echo "PASS"
