name: Test cache-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Go project
        run: |
          mkdir -p /tmp/go-project
          cat > /tmp/go-project/go.mod << 'EOF'
          module example.com/hello

          go 1.21
          EOF
          cat > /tmp/go-project/main.go << 'EOF'
          package main

          func main() {}
          EOF
      - id: action
        uses: .
        with:
          version: "latest"
          install-go: true
          cache-key: "go-stable"
          working-directory: /tmp/go-project
          use-cache: true
      - name: Assert staticcheck ran successfully with cache-key
        run: |
          echo "PASS: staticcheck ran with cache-key input"
