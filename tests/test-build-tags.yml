name: Test build-tags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Go project with build tag
        run: |
          mkdir -p /tmp/go-project
          cat > /tmp/go-project/go.mod << 'EOF'
          module example.com/hello

          go 1.21
          EOF
          cat > /tmp/go-project/main.go << 'EOF'
          package main

          func main() {}
          EOF
          cat > /tmp/go-project/tagged.go << 'EOF'
          //go:build mytag

          package main

          import "fmt"

          func taggedFunc() {
          	fmt.Println("tagged")
          }
          EOF
      - id: action
        uses: .
        with:
          version: "latest"
          install-go: true
          build-tags: "mytag"
          working-directory: /tmp/go-project
          use-cache: false
      - name: Assert staticcheck ran successfully with build-tags
        run: |
          echo "PASS: staticcheck ran with build-tags input"
