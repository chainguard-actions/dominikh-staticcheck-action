name: Test staticcheck with build-tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy Go fixture into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/go-basic" "$GITHUB_WORKSPACE/go-basic"

      - id: action
        uses: .
        with:
          version: "latest"
          install-go: "true"
          use-cache: "false"
          working-directory: "go-basic"
          build-tags: "integration"

      - name: Assert staticcheck ran successfully with build tags
        run: |
          echo "Staticcheck completed successfully with build-tags=integration"
          echo "PASS"
