name: Test staticcheck with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy Go fixture into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/go-subdir/subpkg" "$GITHUB_WORKSPACE/subpkg"

      - id: action
        uses: .
        with:
          version: "latest"
          install-go: "true"
          use-cache: "false"
          working-directory: "subpkg"

      - name: Assert staticcheck ran in subdirectory
        run: |
          echo "Staticcheck completed successfully in subdirectory"
          echo "PASS"
