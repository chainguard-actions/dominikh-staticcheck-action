name: Test staticcheck with output-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy Go fixture into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/go-basic" "$GITHUB_WORKSPACE/go-basic"

      - id: action
        uses: .
        with:
          version: "latest"
          install-go: "true"
          use-cache: "false"
          working-directory: "go-basic"
          output-file: "/tmp/staticcheck-output.txt"

      - name: Assert output file was created
        run: |
          echo "Checking that output file exists..."
          if [ ! -f "/tmp/staticcheck-output.txt" ]; then
            echo "FAIL: output file /tmp/staticcheck-output.txt was not created"
            exit 1
          fi
          echo "Output file exists."
          echo "Contents (may be empty for clean code):"
          cat /tmp/staticcheck-output.txt || true
          echo "PASS"
