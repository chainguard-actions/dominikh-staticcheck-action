name: Test staticcheck with custom checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy Go fixture into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/go-basic" "$GITHUB_WORKSPACE/go-basic"

      - id: action
        uses: .
        with:
          version: "latest"
          install-go: "true"
          use-cache: "false"
          checks: "all"
          working-directory: "go-basic"

      - name: Assert staticcheck ran with custom checks
        run: |
          echo "Staticcheck completed with checks=all on clean code"
          echo "PASS"
