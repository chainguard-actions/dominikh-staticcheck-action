name: Test staticcheck with build-tags and cache-key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          install-go: "true"
          use-cache: "true"
          build-tags: "integration"
          cache-key: "go1.21"
          checks: "inherit"
          working-directory: "actions/hardened/dominikh--staticcheck-action/v1.4.1/tests/fixtures/goproject"
      - name: Assert staticcheck ran successfully with build tags
        run: |
          echo "Staticcheck completed with build-tags and cache-key"
          echo "PASS"
